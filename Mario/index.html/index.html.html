<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FOOD CONTAINERS - Mario vs Luigi</title>
    <style>
        :root { --mario: #e62429; --luigi: #43ad2e; }
        body { font-family: sans-serif; margin: 0; background: #222; touch-action: none; overflow: hidden; }
        
        /* Layout */
        #start-screen { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; color: white; }
        .game-container { display: flex; height: 100vh; padding: 10px; gap: 10px; box-sizing: border-box; }
        .board { flex: 1; background: #fff; border-radius: 15px; display: flex; flex-direction: column; position: relative; border: 5px solid #333; overflow: hidden; }
        .mario { border-color: var(--mario); }
        .luigi { border-color: var(--luigi); }
        
        /* UI */
        .score-bar { text-align: center; padding: 10px; background: #eee; font-size: 1.2rem; font-weight: bold; }
        .play-area { flex-grow: 1; position: relative; background: #f9f9f9; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; padding: 10px; background: #ddd; }
        
        /* Items */
        .food-item { width: 60px; height: 60px; position: absolute; cursor: grab; z-index: 10; touch-action: none; }
        .food-item img { width: 100%; height: 100%; pointer-events: none; }
        .drop-zone { aspect-ratio: 1/1; background: #fff; border: 2px dashed #ccc; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.7rem; text-align: center; }
        .drop-zone img { width: 40px; height: 40px; margin-bottom: 2px; }
        .drop-zone.hovered { background: #ffffcc; border-color: orange; }

        /* Animations */
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .floating { animation: float 3s ease-in-out infinite; }
        .bowser { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); width: 150px; pointer-events: none; opacity: 0; transition: 0.3s; z-index: 100; }
        .show-bowser { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1>FOOD CONTAINERS</h1>
        <button style="padding: 15px 30px; font-size: 1.5rem; cursor:pointer;" onclick="startGame()">START GAME</button>
    </div>

    <div class="game-container">
        <div class="board mario" id="board-mario">
            <div class="score-bar">MARIO: <span class="score">0</span></div>
            <div class="play-area"></div>
            <img src="bowser.png" class="bowser" alt="BOWSER!">
            <div class="grid"></div>
        </div>

        <div class="board luigi" id="board-luigi">
            <div class="score-bar">LUIGI: <span class="score">0</span></div>
            <div class="play-area"></div>
            <img src="bowser.png" class="bowser" alt="BOWSER!">
            <div class="grid"></div>
        </div>
    </div>

<script>
/** * 🖼️ IMAGE SETUP 
 * Place your images in the same folder as this file.
 * Ensure the names match the "foodImg" and "contImg" below.
 */
const GAME_DATA = [
    { id: 'bottle', text: 'CONTAINER', foodImg: 'bottle.png', contImg: 'bin.png' },
    { id: 'glass',  text: 'MILKSHAKE', foodImg: 'glass.png',  contImg: 'milkshake.png' },
    { id: 'bag',    text: 'CANDY',     foodImg: 'bag.png',    contImg: 'candy_box.png' },
    { id: 'tub',    text: 'POPCORN',   foodImg: 'tub.png',    contImg: 'bucket.png' },
    { id: 'cup',    text: 'TEA',       foodImg: 'cup.png',    contImg: 'saucer.png' },
    { id: 'slice',  text: 'PIZZA',     foodImg: 'slice.png',  contImg: 'pizza_box.png' },
    { id: 'can',    text: 'JUICE',     foodImg: 'can.png',    contImg: 'juice_pack.png' },
    { id: 'bowl',   text: 'SALAD',     foodImg: 'bowl.png',   contImg: 'salad_bowl.png' }
];

class Game {
    constructor(id) {
        this.board = document.getElementById(id);
        this.score = 0;
        this.render();
    }

    render() {
        const area = this.board.querySelector('.play-area');
        const grid = this.board.querySelector('.grid');
        
        GAME_DATA.forEach(item => {
            // Create Containers (Drop Zones)
            const zone = document.createElement('div');
            zone.className = 'drop-zone';
            zone.dataset.id = item.id;
            zone.innerHTML = `<img src="${item.contImg}"><b>${item.text}</b>`;
            grid.appendChild(zone);

            // Create Food
            const food = document.createElement('div');
            food.className = 'food-item floating';
            food.dataset.id = item.id;
            food.style.left = Math.random() * 80 + '%';
            food.style.top = Math.random() * 80 + '%';
            food.innerHTML = `<img src="${item.foodImg}">`;
            this.setupDrag(food);
            area.appendChild(food);
        });
    }

    setupDrag(el) {
        let active = false;
        const start = () => { active = true; el.classList.remove('floating'); el.style.zIndex = 100; };
        const end = (e) => {
            if (!active) return;
            active = false;
            el.style.zIndex = 10;
            const touch = e.changedTouches ? e.changedTouches[0] : e;
            this.checkDrop(el, touch.clientX, touch.clientY);
        };
        const move = (e) => {
            if (!active) return;
            const touch = e.touches ? e.touches[0] : e;
            const rect = this.board.querySelector('.play-area').getBoundingClientRect();
            el.style.left = (touch.clientX - rect.left - 30) + 'px';
            el.style.top = (touch.clientY - rect.top - 30) + 'px';
        };

        el.addEventListener('mousedown', start);
        el.addEventListener('touchstart', start);
        window.addEventListener('mousemove', move);
        window.addEventListener('touchmove', move);
        window.addEventListener('mouseup', end);
        window.addEventListener('touchend', end);
    }

    checkDrop(el, x, y) {
        const zones = this.board.querySelectorAll('.drop-zone');
        let hit = false;

        zones.forEach(z => {
            const r = z.getBoundingClientRect();
            if (x > r.left && x < r.right && y > r.top && y < r.bottom) {
                if (z.dataset.id === el.dataset.id) {
                    this.score += 10;
                    el.remove();
                    hit = true;
                } else {
                    this.score = Math.max(0, this.score - 5);
                    this.fail();
                }
            }
        });

        if (!hit) el.classList.add('floating');
        this.board.querySelector('.score').innerText = this.score;
    }

    fail() {
        const b = this.board.querySelector('.bowser');
        b.classList.add('show-bowser');
        setTimeout(() => b.classList.remove('show-bowser'), 800);
    }
}

function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    new Game('board-mario');
    new Game('board-luigi');
}
</script>
</body>
</html>
